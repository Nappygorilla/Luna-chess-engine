name: Build and deploy Luna Chess Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package website and Stockfish WebAssembly engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/stockfish
          cp index.html _site/index.html
          cp THIRD-PARTY-NOTICES.md _site/THIRD-PARTY-NOTICES.md
          npm pack stockfish@19.0.1 --silent
          tar -xzf stockfish-19.0.1.tgz package/bin/stockfish-19-lite-single.js package/bin/stockfish-19-lite-single.wasm package/Copying.txt
          cp package/bin/stockfish-19-lite-single.js _site/vendor/stockfish/
          cp package/bin/stockfish-19-lite-single.wasm _site/vendor/stockfish/
          cp package/Copying.txt _site/vendor/stockfish/LICENSE-GPL-3.0.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
