name: Build and deploy Luna Chess Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package website and original Luna Engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor
          cp index.html _site/index.html
          cp THIRD-PARTY-NOTICES.md _site/THIRD-PARTY-NOTICES.md
          cp LICENSE _site/LICENSE
          cp engine/luna-engine-worker.js _site/vendor/luna-engine.js
          npm pack chess.js@0.10.3 --silent
          tar -xzf chess.js-0.10.3.tgz package/chess.js package/LICENSE
          cp package/chess.js _site/vendor/chess.js
          cp package/LICENSE _site/vendor/CHESSJS-LICENSE.txt
          touch _site/.nojekyll

      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify chessboard and Stockfish in Chromium
        run: node scripts/smoke-test.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
